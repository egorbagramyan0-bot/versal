<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — банкетный зал «Версаль»</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ysabeau+Office:ital,wght@0,200;0,300;0,500;1,200&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 24px 16px;
      background: linear-gradient(180deg, #eef0f2, #f7f8f9 60%, #fff);
      color: #2b2e33; font: 400 16px/1.6 'Ysabeau Office', system-ui, sans-serif; text-align: center;
    }
    .mark { margin: 0 0 6px; font: 200 clamp(64px, 14vw, 120px)/1 'Ysabeau Office', sans-serif; letter-spacing: .08em; color: #b4b9bf; }
    h1 { margin: 0; font: 200 clamp(30px, 5vw, 44px)/1.15 'Ysabeau Office', sans-serif; color: #17191c; }
    h1 em { color: #545a62; }
    p { margin: 14px auto 28px; max-width: 34ch; color: #545a62; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px;
      font: 600 13.5px/1 'Ysabeau Office', sans-serif; letter-spacing: .03em; text-decoration: none;
      border: 1px solid #d5d9dd; color: #17191c; background: #fff;
    }
    a.btn--dark { background: #17191c; border-color: #17191c; color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="mark" aria-hidden="true">404</p>
    <h1>Такой страницы <em>нет</em></h1>
    <p>Возможно, ссылка устарела. Вернитесь на главную — там зал, меню и заявка.</p>
    <div class="actions">
      <a class="btn btn--dark" href="/">На главную</a>
      <a class="btn" href="/menu.html">Банкетное меню</a>
    </div>
  </main>
</body>
</html>
